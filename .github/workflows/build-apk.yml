{
"name": "Build Android TV APK",
"on": {"workflow_dispatch": {"inputs": {"city": {"description": "City name", "required": true}, "latitude": {"description": "Latitude e.g. 28.6139", "required": true}, "longitude": {"description": "Longitude e.g. 77.2090", "required": true}, "region": {"description": "Two-letter country code", "required": true, "default": "IN"}}}},
"jobs": {"build": {"runs-on": "ubuntu-24.04", "steps": [
{"uses": "actions/checkout@v7", "with": {"repository": "simbasjungles/free-my-tv"}},
{"uses": "actions/setup-java@v5", "with": {"distribution": "temurin", "java-version": "17"}},
{"name": "Android SDK", "run": "yes | \"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" --sdk_root=\"$RUNNER_TEMP/sdk\" \"build-tools;34.0.0\" \"platforms;android-34\" > /dev/null\necho \"ANDROID_HOME=$RUNNER_TEMP/sdk\" >> \"$GITHUB_ENV\""},
{"name": "Write config", "env": {"CITY": "${{ inputs.city }}", "LAT": "${{ inputs.latitude }}", "LON": "${{ inputs.longitude }}", "REGION": "${{ inputs.region }}"}, "run": "cp config.example.properties config.properties\nsed -i -E \"s/^city=.*/city=$CITY/; s/^latitude=.*/latitude=$LAT/; s/^longitude=.*/longitude=$LON/; s/^tmdb_region=.*/tmdb_region=$REGION/\" config.properties"},
{"run": "bash build.sh"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "FreeMyTV-apk", "path": "FreeMyTV.apk"}}
]}}
}
